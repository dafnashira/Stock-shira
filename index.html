<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>Stock Shira - NVDA & GOOGL</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      direction: rtl;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    .chart-container {
      width: 90%;
      max-width: 900px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    button {
      margin: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>📈 Stock Shira - NVDA & GOOGL</h1>
  <p>נתוני מניות מאוגוסט 2025 עם עדכון יומי</p>

  <button onclick="loadStockData()">עדכן נתונים עכשיו</button>

  <div class="chart-container">
    <canvas id="nvdaChart"></canvas>
  </div>

  <div class="chart-container">
    <canvas id="googlChart"></canvas>
  </div>

  <script>
    async function fetchStock(symbol) {
      const apiKey = "demo"; // אפשר להחליף ל-API אמיתי אם תרצי
      const url = `https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${symbol}&apikey=${apiKey}`;
      const response = await fetch(url);
      return response.json();
    }

    function buildChart(ctx, data, label) {
      const dates = Object.keys(data).slice(0, 20).reverse();
      const prices = dates.map(d => parseFloat(data[d]["4. close"]));
      new Chart(ctx, {
        type: "line",
        data: {
          labels: dates,
          datasets: [{
            label: label,
            data: prices,
            borderColor: "#007bff",
            backgroundColor: "rgba(0, 123, 255, 0.2)",
            tension: 0.3
          }]
        },
        options: { responsive: true }
      });
    }

    async function loadStockData() {
      document.querySelector("button").innerText = "טוען נתונים...";
      const nvda = await fetchStock("NVDA");
      const googl = await fetchStock("GOOGL");

      buildChart(document.getElementById("nvdaChart"), nvda["Time Series (Daily)"], "NVDA");
      buildChart(document.getElementById("googlChart"), googl["Time Series (Daily)"], "GOOGL");

      document.querySelector("button").innerText = "עדכן נתונים עכשיו";
    }

    loadStockData(); // טוען אוטומטית כשנכנסים
  </script>
</body>
</html>
