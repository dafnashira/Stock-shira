<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>Stock Shira – NVDA & GOOGL</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; direction: rtl; }
    button { padding: 10px 20px; margin: 10px; font-size: 16px; }
    #error { color: red; display: none; margin: 10px; }
    .chart { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Stock Shira – NVDA & 📈 GOOGL</h1>
  <p>נתוני מניות מאוגוסט 2025 עם עדכון יומי</p>

  <button id="loadBtn">טעני נתונים...</button>
  <div id="error"></div>

  <h2>NVDA – היסטוריה</h2>
  <pre id="nvdaBox" class="chart"></pre>

  <h2>GOOGL – היסטוריה</h2>
  <pre id="googlBox" class="chart"></pre>

  <script>
    const errorBox = document.getElementById("error");
    const nvdaBox = document.getElementById("nvdaBox");
    const googlBox = document.getElementById("googlBox");
    const loadBtn = document.getElementById("loadBtn");

    async function fetchWithProxy(url) {
      const proxy = "https://api.allorigins.win/raw?url=";
      const res = await fetch(proxy + encodeURIComponent(url));
      if (!res.ok) throw new Error("בעיה בטעינה");
      return res.json();
    }

    async function loadAll() {
      errorBox.style.display = "none";
      nvdaBox.textContent = "טוען...";
      googlBox.textContent = "טוען...";
      try {
        // NVDA
        const nvda = await fetchWithProxy("https://query1.finance.yahoo.com/v8/finance/chart/NVDA?interval=1d&range=1mo");
        nvdaBox.textContent = JSON.stringify(nvda.chart.result[0].meta, null, 2);

        // GOOGL
        const googl = await fetchWithProxy("https://query1.finance.yahoo.com/v8/finance/chart/GOOGL?interval=1d&range=1mo");
        googlBox.textContent = JSON.stringify(googl.chart.result[0].meta, null, 2);

      } catch (err) {
        console.error(err);
        errorBox.textContent = "שגיאה בטעינת נתונים: " + err.message;
        errorBox.style.display = "block";
      }
    }

    loadBtn.addEventListener("click", loadAll);
    window.addEventListener("load", loadAll);
  </script>
</body>
</html>
