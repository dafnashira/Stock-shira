<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stock Shira – NVDA & GOOGL & CMS 📈</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --ink:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --accent:#2563eb;
      --accent-weak:#dbeafe;
      --good:#16a34a;
      --bad:#dc2626;
      --chip:#eef2ff;
      --col-even:#fafafa;
      --shadow:0 8px 20px rgba(0,0,0,.06);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,Arial}
    .wrap{max-width:980px;margin:auto;padding:22px}
    h1{margin:6px 0 2px;font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:.3px}
    .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:14px 0}
    .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .btn{
      appearance:none;border:none;border-radius:14px;background:var(--accent);color:#fff;
      padding:12px 18px;font-weight:600;cursor:pointer;box-shadow:0 6px 14px rgba(37,99,235,.25)
    }
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .pill{background:var(--accent-weak);color:var(--accent);padding:.25rem .7rem;border-radius:999px;font-weight:500}
    .status{display:none;padding:10px 12px;border-radius:12px;font-size:14px}
    .status.ok{display:block;background:#ecfdf5;color:var(--good);border:1px solid #bbf7d0}
    .status.err{display:block;background:#fef2f2;color:var(--bad);border:1px solid #fecaca}

    /* Watchlist (סגנון Google Finance) */
    .watch{display:grid;grid-template-columns:1fr;gap:12px}
