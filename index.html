<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stock Shira – NVDA, GOOGL, CMS</title>
  <style>
    :root{
      --bg:#f2f3f7; --card:#fff; --ink:#222; --muted:#6b7280;
      --brand:#2563eb; --good:#16a34a; --bad:#dc2626; --line:#e5e7eb;
      --colA:#f8fafc; --colB:#f3f4f6; --colC:#eef2ff; --colD:#fefce8; --colE:#ecfeff; --colF:#fef2f2;
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans Hebrew",Arial,sans-serif}
    .wrap{max-width:980px;margin:auto;padding:24px 14px}
    h1{font-size:28px;margin:0 0 6px}
    .muted{color:var(--muted);font-size:14px}
    .bar{display:flex;gap:12px;align-items:center;margin:16px 0 22px}
    .btn{background:var(--brand);color:#fff;border:0;padding:10px 16px;border-radius:999px;font-weight:600}
    .btn[disabled]{opacity:.6}
    .status{font-size:13px;padding:8px 12px;border-radius:10px;background:#e9f5ff;color:#0369a1;display:none}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:0 6px 22px rgba(0,0,0,.05);padding:16px;margin:18px 0}
    .card h2{margin:0 0 10px;font-size:20px}
    table{width:100%;border-collapse:separate;border-spacing:0;border-radius:12px;overflow:hidden}
    thead th{background:#111827;color:#fff;font-weight:700;padding:12px 10px;border-bottom:2px solid #000}
    tbody td{padding:10px;border-bottom:1px solid var(--line)}
    tbody tr:last-child td{border-bottom:0}
    /* רקע עדין משתנה לעמודות */
    tbody td:nth-child(1){background:var(--colA)}
    tbody td:nth-child(2){background:var(--colB)}
    tbody td:nth-child(3){background:var(--colC)}
    tbody td:nth-child(4){background:var(--colD)}
    tbody td:nth-child(5){background:var(--colE)}
    tbody td:nth-child(6){background:var(--colF)}
    .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
    .sum-row{font-weight:700;background:#f8fafc}
    .grid{display:grid;gap:16px}
    @media(min-width:780px){.grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Stock Shira – NVDA & 📈 GOOGL & CMS</h1>
    <div class="muted" id="subtitle">נתוני מניות — <span id="today"></span></div>

    <div class="bar">
      <button id="loadBtn" class="btn">…טעני נתונים</button>
      <div id="status" class="status"></div>
    </div>

    <!-- סיכום אחרון -->
    <div class="card">
      <h2>סיכום אחרון</h2>
      <div class="tbl-wrap">
        <table id="summary">
          <thead><tr><th>סימול</th><th>תאריך</th><th>פתיחה</th><th>גבוה</th><th>נמוך</th><th>סגירה</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- שתי טבלאות היסטוריה -->
    <div class="grid">
      <div class="card">
        <h2>היסטוריה — NVDA</h2>
        <div class="tbl-wrap"><table id="tbl-NVDA">
          <thead><tr><th>תאריך</th><th>פתיחה</th><th>גבוה</th><th>נמוך</th><th>סגירה</th><th>נפח</th></tr></thead>
          <tbody><tr><td colspan="6" class="muted">…טוען</td></tr></tbody>
        </table></div>
      </div>
      <div class="card">
        <h2>היסטוריה — GOOGL</h2>
        <div class="tbl-wrap"><table id="tbl-GOOGL">
          <thead><tr><th>תאריך</th><th>פתיחה</th><th>גבוה</th><th>נמוך</th><th>סגירה</th><th>נפח</th></tr></thead>
          <tbody><tr><td colspan="6" class="muted">…טוען</td></tr></tbody>
        </table></div>
      </div>
    </div>

    <div class="card">
      <h2>היסטוריה — CMS</h2>
      <div class="tbl-wrap"><table id="tbl-CMS">
        <thead><tr><th>תאריך</th><th>פתיחה</th><th>גבוה</th><th>נמוך</th><th>סגירה</th><th>נפח</th></tr></thead>
        <tbody><tr><td colspan="6" class="muted">…טוען</td></tr></tbody>
      </table></div>
    </div>
  </div>

  <script>
    // ==== תצורה ====
    const TICKERS = [
      { sym: "NVDA", stooq: "nvda.us"  },
      { sym: "GOOGL", stooq: "googl.us"},
      { sym: "CMS",   stooq: "cms.us"  },
    ];
    const statusBox = document.getElementById("status");
    const loadBtn = document.getElementById("loadBtn");

    // תאריך בכותרת
    const d = new Date();
    const hebDate = d.toLocaleDateString("he-IL",{year:"numeric",month:"2-digit",day:"2-digit"});
    document.getElementById("today").textContent = `נתונים להיום • ${hebDate}`;

    function setStatus(msg, ok=true){
      statusBox.textContent = msg;
      statusBox.style.display = "block";
      statusBox.style.background = ok ? "#e9fbe9" : "#fee2e2";
      statusBox.style.color = ok ? "#065f46" : "#991b1b";
    }
    function clearStatus(){ statusBox.style.display = "none"; }

    async function fetchCSV(stooqCode){
      // CSV יומי מ-Stooq (מאוגוסט 2025 ואילך)
      const url = `https://stooq.com/q/d/l/?s=${encodeURIComponent(stooqCode)}&i=d`;
      const res = await fetch(url, { cache: "no-store" });
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.text();
    }
    function parseCSV(text){
      // כותרות Stooq: Date,Open,High,Low,Close,Volume
      const rows = text.trim().split(/\r?\n/).slice(1) // skip header
        .map(line => line.split(","))
        .filter(cols => cols.length >= 6 && cols[0] && cols[1] !== "null");
      // מהשנה הנוכחית אחורה – לא חובה, רק לקיצור
      return rows.map(c => ({
        date: c[0], open:+c[1], high:+c[2], low:+c[3], close:+c[4], vol:+c[5]
      })).reverse(); // שורה אחרונה = העדכני ביותר
    }
    function fmt(n, d=2){ return Number(n).toLocaleString("he-IL",{maximumFractionDigits:d}); }

    function fillHistory(sym, arr){
      const tbody = document.querySelector(`#tbl-${sym} tbody`);
      tbody.innerHTML = "";
      arr.forEach(r=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${r.date}</td><td>${fmt(r.open)}</td><td>${fmt(r.high)}</td>
                        <td>${fmt(r.low)}</td><td>${fmt(r.close)}</td><td>${fmt(r.vol,0)}</td>`;
        tbody.appendChild(tr);
      });
    }
    function fillSummary(items){
      const tbody = document.querySelector("#summary tbody");
      tbody.innerHTML = "";
      items.forEach(({sym, latest})=>{
        const tr = document.createElement("tr");
        tr.className = "sum-row";
        tr.innerHTML = `<td>${sym}</td><td>${latest.date}</td>
                        <td>${fmt(latest.open)}</td><td>${fmt(latest.high)}</td>
                        <td>${fmt(latest.low)}</td><td>${fmt(latest.close)}</td>`;
        tbody.appendChild(tr);
      });
    }

    async function loadAll(){
      setStatus("טוען נתונים…");
      loadBtn.disabled = true;
      try{
        const results = [];
        for(const t of TICKERS){
          const csv = await fetchCSV(t.stooq);
          const data = parseCSV(csv).filter(r => r.date >= "2025-08-01"); // מאוגוסט 2025
          if(!data.length) throw new Error(`אין רשומות עבור ${t.sym}`);
          fillHistory(t.sym, data);
          results.push({ sym: t.sym, latest: data[data.length-1] });
        }
        fillSummary(results);
        setStatus("הנתונים נטענו בהצלחה.", true);
      }catch(err){
        console.error(err);
        setStatus(`שגיאה בטעינת נתונים: ${err.message}`, false);
      }finally{
        loadBtn.disabled = false;
      }
    }

    // טעינה ידנית + אוטומטית
    loadBtn.addEventListener("click", () => { clearStatus(); loadAll(); });
    window.addEventListener("load", () => loadAll());
  </script>
</body>
</html>
