<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>Stock Shira – NVDA, GOOGL & CMS 📈</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      text-align: center;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    h2 {
      margin: 20px 0 10px;
      color: #333;
    }

    .date {
      color: #666;
      margin-bottom: 15px;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      margin: 10px auto;
      max-width: 400px;
      display: none;
    }

    .success {
      background: #e6f9ec;
      color: #2d8a47;
      display: block;
    }

    .error {
      background: #fdecea;
      color: #b71c1c;
      display: block;
    }

    button {
      background: #1976d2;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 0;
    }

    button:hover {
      background: #1565c0;
    }

    table {
      border-collapse: collapse;
      margin: 15px auto;
      width: 95%;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
    }

    th {
      background: #263238;
      color: white;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>Stock Shira – NVDA, GOOGL & CMS 📈</h1>
  <div class="date" id="todayDate"></div>

  <button id="loadBtn">טעני נתונים...</button>
  <div id="statusBox" class="status"></div>

  <h2>סיכום אחרון</h2>
  <table id="latestTable">
    <thead>
      <tr>
        <th>סימול</th>
        <th>תאריך</th>
        <th>פתיחה</th>
        <th>גבוה</th>
        <th>נמוך</th>
        <th>סגירה</th>
        <th>נפח</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>NVDA – היסטוריה</h2>
  <table id="nvdaTable">
    <thead>
      <tr>
        <th>תאריך</th>
        <th>פתיחה</th>
        <th>גבוה</th>
        <th>נמוך</th>
        <th>סגירה</th>
        <th>נפח</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>GOOGL – היסטוריה</h2>
  <table id="googlTable">
    <thead>
      <tr>
        <th>תאריך</th>
        <th>פתיחה</th>
        <th>גבוה</th>
        <th>נמוך</th>
        <th>סגירה</th>
        <th>נפח</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>CMS – היסטוריה</h2>
  <table id="cmsTable">
    <thead>
      <tr>
        <th>תאריך</th>
        <th>פתיחה</th>
        <th>גבוה</th>
        <th>נמוך</th>
        <th>סגירה</th>
        <th>נפח</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // מציג את התאריך של היום
    const today = new Date();
    document.getElementById("todayDate").textContent =
      today.toLocaleDateString("he-IL", { day:"2-digit", month:"2-digit", year:"numeric" });

    const loadBtn = document.getElementById("loadBtn");
    const statusBox = document.getElementById("statusBox");

    async function fetchStock(symbol, tableId, latestTableBody) {
      const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?range=1mo&interval=1d`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("בעיה בשליפת נתונים");

        const data = await res.json();
        const result = data.chart.result[0];
        const timestamps = result.timestamp;
        const quotes = result.indicators.quote[0];

        const tbody = document.getElementById(tableId).querySelector("tbody");
        tbody.innerHTML = "";

        timestamps.forEach((ts, i) => {
          const date = new Date(ts * 1000).toLocaleDateString("he-IL");
          const row = `
            <tr>
              <td>${date}</td>
              <td>${quotes.open[i]?.toFixed(2)}</td>
              <td>${quotes.high[i]?.toFixed(2)}</td>
              <td>${quotes.low[i]?.toFixed(2)}</td>
              <td>${quotes.close[i]?.toFixed(2)}</td>
              <td>${quotes.volume[i]?.toLocaleString()}</td>
            </tr>`;
          tbody.innerHTML += row;
        });

        // הוספה לטבלת הסיכום (רק הנתון האחרון)
        const lastIndex = timestamps.length - 1;
        const lastDate = new Date(timestamps[lastIndex] * 1000).toLocaleDateString("he-IL");
        const lastRow = `
          <tr>
            <td>${symbol}</td>
            <td>${lastDate}</td>
            <td>${quotes.open[lastIndex]?.toFixed(2)}</td>
            <td>${quotes.high[lastIndex]?.toFixed(2)}</td>
            <td>${quotes.low[lastIndex]?.toFixed(2)}</td>
            <td>${quotes.close[lastIndex]?.toFixed(2)}</td>
            <td>${quotes.volume[lastIndex]?.toLocaleString()}</td>
          </tr>`;
        latestTableBody.innerHTML += lastRow;

        return true;
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    async function loadAll() {
      statusBox.className = "status";
      statusBox.textContent = "טוען נתונים...";
      statusBox.style.display = "block";

      const latestTableBody = document.getElementById("latestTable").querySelector("tbody");
      latestTableBody.innerHTML = "";

      const nvdaOk = await fetchStock("NVDA", "nvdaTable", latestTableBody);
      const googlOk = await fetchStock("GOOGL", "googlTable", latestTableBody);
      const cmsOk = await fetchStock("CMS", "cmsTable", latestTableBody);

      if (nvdaOk && googlOk && cmsOk) {
        statusBox.className = "status success";
        statusBox.textContent = "הנתונים נטענו בהצלחה.";
      } else {
        statusBox.className = "status error";
        statusBox.textContent = "שגיאה בטעינת נתונים.";
      }
    }

    loadBtn.addEventListener("click", loadAll);
    window.addEventListener("load", loadAll);
  </script>
</body>
</html>
