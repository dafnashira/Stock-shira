<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Stock Shira – Portfolio (5y Monthly & Yearly)</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --ink:#111827;
    --muted:#6b7280; --brand:#1f7ae0;
    --ok-bg:#eaf9ea; --ok-ink:#136c13;
    --err-bg:#ffe6e6; --err-ink:#a40000;
    --head:#0f172a; --head-ink:#fff;
    --row-even:#f9fbff; --border:#e5e7eb;
    --radius:14px; --shadow:0 8px 20px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  body{font-family:Arial,"Segoe UI",system-ui; margin:0; background:var(--bg); color:var(--ink)}
  .wrap{max-width:1100px; margin:auto; padding:24px}
  h1{margin:4px 0 8px; font-size:30px}
  .muted{color:var(--muted); font-size:14px}
  .pill{display:inline-block; padding:6px 10px; border-radius:999px; font-size:13px; background:#eef2ff}
  .topbar{display:flex; gap:12px; align-items:center; flex-wrap:wrap}

  button{background:var(--brand); color:#fff; border:0; border-radius:12px; padding:10px 16px; font-size:15px; cursor:pointer; box-shadow:0 6px 14px rgba(31,122,224,.22)}
  button:disabled{opacity:.6; cursor:not-allowed; box-shadow:none}
  .btn-ghost{background:#eef2ff; color:#0f172a}
  .btn-danger{background:#e11d48}

  .grid{display:grid; gap:18px; grid-template-columns:1fr}
  @media (min-width:980px){ .grid{grid-template-columns:1fr 1fr} }

  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px}
  .title{font-weight:700; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  input[type="text"]{padding:10px 12px; border-radius:10px; border:1px solid #dbe1ea; font-size:15px; background:#fff; width:240px}
  label{font-size:13px; color:var(--muted)}

  #error{display:none; background:var(--err-bg); color:var(--err-ink); padding:10px; border-radius:10px; margin:12px 0}
  #ok{display:none; background:var(--ok-bg); color:var(--ok-ink); padding:8px 12px; border-radius:10px; margin:10px 0; font-size:14px}
  .status{font-size:13px; color:#4b5563}

  table{width:100%; border-collapse:separate; border-spacing:0; font-size:14px; overflow:hidden; border-radius:12px}
  thead th{background:var(--head); color:var(--head-ink); font-weight:700; padding:10px 8px; position:sticky; top:0}
  tbody td{padding:9px 8px; text-align:center; border-bottom:1px solid var(--border)}
  tbody tr:nth-child(even){background:var(--row-even)}
  tbody tr:hover{background:#eef6ff}
  td:nth-child(5){font-weight:700} /* עמודת סגירה מודגשת בכל הטבלאות */

  /* חיווי סגירה: ירוק/אדום + רקע + חץ */
  .up, .down, .flat{
    display:inline-flex; align-items:center; gap:6px;
    padding:3px 8px; border-radius:999px;
    font-weight:700; line-height:1;
  }
  .up   { color:#0f7b0f; background:#e9f7ec; }
  .down { color:#b91c1c; background:#fee2e2; }
  .flat { color:#111;    background:#eef1f4; }
  .arrow{ font-size:11px; opacity:.9; }

  .mini{font-size:12px; color:var(--muted)}
  .cap{letter-spacing:.5px}
  .chartbox{border:1px solid var(--border); border-radius:12px; padding:8px; background:#fff; margin-bottom:10px}
  canvas{width:100%; max-height:260px}
  .section{margin-top:10px; font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>📈 Stock Shira – Portfolio</h1>
    <span class="pill" id="today">—</span>
  </div>
  <div class="muted">5 שנים אחרונות (חודשי + סיכום שנתי) • גרפים, חיפוש והוספת סימולים (כולל קריפטו).</div>

  <div id="ok">הנתונים נטענו בהצלחה.</div>
  <div id="error"></div>

  <div class="row" style="margin:12px 0 16px">
    <button id="loadAllBtn">טעני הכל</button>
    <span class="status" id="status">מוכן</span>
    <span class="pill mini" id="countPill">0 מניות</span>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="row">
      <div>
        <label for="addSymbol">הוספת סימול (מניות/קריפטו ב־Yahoo)</label><br>
        <input id="addSymbol" list="popular" placeholder="לדוגמה: TSLA / INTC / HOOD / BTC-USD">
        <datalist id="popular">
          <option value="NVDA"><option value="GOOGL"><option value="CMS"><option value="PLTR">
          <option value="PANW"><option value="MSFT"><option value="INTC"><option value="HOOD">
          <option value="BTC-USD"><option value="AMZN"><option value="META"><option value="TSLA">
        </datalist>
      </div>
      <button id="addBtn" class="btn-ghost">הוסיפי</button>
      <span class="mini">טיפ: Enter בשדה להוספה מהירה</span>
    </div>
  </div>

  <div class="card" style="margin-bottom:18px">
    <div class="title">
      <span>סיכום אחרון (Daily)</span>
      <span class="mini">יום המסחר האחרון לכל סימול</span>
    </div>
    <div style="overflow:auto">
      <table id="lastTbl">
        <thead>
          <tr><th>סימול</th><th>תאריך</th><th>פתיחה</th><th>גבוה</th><th>נמוך</th><th>סגירה</th><th>נפח</th><th></th></tr>
        </thead>
        <tbody><tr><td colspan="8">—</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="cards" class="grid"></div>
</div>

<script>
/* ===== תאריך בכותרת ===== */
document.getElementById("today").textContent =
  new Date().toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"numeric"});

/* ===== מצב האפליקציה ===== */
const YEARS = 5; // שנים אחורה
const state = {
  // הסרתי AAPL; הוספתי INTC, HOOD, BTC-USD
  symbols: new Set(["NVDA","GOOGL","CMS","PLTR","PANW","MSFT","INTC","HOOD","BTC-USD"]),
  charts: new Map(),   // symbol -> Chart instance
  dataDaily: new Map(), // symbol -> rows daily
  dataMonthly: new Map(), // symbol -> rows monthly agg
  dataYearly: new Map()  // symbol -> rows yearly agg
};
const $ = s => document.querySelector(s);
const cardsEl = $("#cards");
const lastBody = $("#lastTbl tbody");
const statusEl = $("#status");
const okBox = $("#ok");
const errBox = $("#error");
const countPill = $("#countPill");

function setStatus(t){ statusEl.textContent = t; }
function showOk(msg){ okBox.style.display="block"; okBox.textContent=msg||"בוצע"; }
function clearOk(){ okBox.style.display="none"; }
function showErr(msg){ errBox.style.display="block"; errBox.textContent=msg; }
function clearErr(){ errBox.style.display="none"; }
function refreshCount(){ countPill.textContent = `${state.symbols.size} סימולים`; }

/* ===== פרוקסי + Yahoo ===== */
function proxyChain(url){
  const clean = url.replace(/^https?:\/\//,'');
  return [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://r.jina.ai/http://${clean}`,
    `https://cors.isomorphic-git.org/https://${clean}`,
    `https://thingproxy.freeboard.io/fetch/${url}`,
  ];
}
async function fetchWithFallback(url){
  const urls = proxyChain(url);
  let lastErr;
  for(const u of urls){
    try{
      const res = await fetch(u,{cache:"no-store"});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const txt = await res.text();
      try { return JSON.parse(txt); } catch { return JSON.parse(txt.trim()); }
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("fetch failed");
}
function yahooUrl(symbol){
  const now = new Date();
  const start = new Date(now);
  start.setFullYear(now.getFullYear() - YEARS);
  const p1 = Math.floor(start.getTime()/1000);
  const p2 = Math.floor(now.getTime()/1000);
  return `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?period1=${p1}&period2=${p2}&interval=1d&includeAdjustedClose=true`;
}
function parseYahooChart(j){
  const r = j?.chart?.result?.[0];
  const t = r?.timestamp || [];
  const q = r?.indicators?.quote?.[0] || {};
  return t.map((sec,i)=>({
    date:new Date(sec*1000),
    open:q.open?.[i], high:q.high?.[i], low:q.low?.[i], close:q.close?.[i], volume:q.volume?.[i]
  })).filter(r=>typeof r.close==="number");
}

/* ===== אגירה חודשית/שנתית ===== */
const keyMonth = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
const keyYear  = d => `${d.getFullYear()}`;

function aggregateMonthly(rows){
  const map = new Map();
  for(const r of rows){
    const k = keyMonth(r.date);
    if(!map.has(k)){
      map.set(k,{key:k, firstDate:r.date, lastDate:r.date, open:r.open, high:r.high, low:r.low, close:r.close, volume:r.volume||0});
    }else{
      const m = map.get(k);
      // update
      if(r.date < m.firstDate){ m.firstDate = r.date; m.open = r.open; }
      if(r.date > m.lastDate){ m.lastDate  = r.date; m.close = r.close; }
      m.high = Math.max(m.high, r.high);
      m.low  = Math.min(m.low,  r.low);
      m.volume += r.volume || 0;
    }
  }
  return Array.from(map.values()).sort((a,b)=> a.firstDate - b.firstDate);
}

function aggregateYearly(rows){
  const map = new Map();
  for(const r of rows){
    const k = keyYear(r.date);
    if(!map.has(k)){
      map.set(k,{key:k, firstDate:r.date, lastDate:r.date, open:r.open, high:r.high, low:r.low, close:r.close, volume:r.volume||0});
    }else{
      const y = map.get(k);
      if(r.date < y.firstDate){ y.firstDate = r.date; y.open = r.open; }
      if(r.date > y.lastDate){ y.lastDate  = r.date; y.close = r.close; }
      y.high = Math.max(y.high, r.high);
      y.low  = Math.min(y.low,  r.low);
      y.volume += r.volume || 0;
    }
  }
  return Array.from(map.values()).sort((a,b)=> a.firstDate - b.firstDate);
}

/* ===== עזרי תצוגה ===== */
function fmtDate(d){return d.toISOString().slice(0,10);}
function fmtNum(n){return (n==null||isNaN(n))?"-":Number(n).toLocaleString("he-IL",{maximumFractionDigits:2});}
function closeCell(o,c){
  const up=c>o, down=c<o;
  const cls=up?"up":down?"down":"flat";
  const arrow=up?"🔺":down?"🔻":"▬";
  const aria=up?"עלייה":down?"ירידה":"ללא שינוי";
  return `<span class="${cls}" aria-label="${aria}">${fmtNum(c)}<span class="arrow">${arrow}</span></span>`;
}

/* ===== כרטיס סימול ===== */
function ensureCard(symbol){
  if(document.getElementById(`card-${symbol}`)) return;
  const card = document.createElement("div");
  card.className="card";
  card.id = `card-${symbol}`;
  card.innerHTML = `
    <div class="title">
      <span>${symbol} — 5y Monthly / Yearly</span>
      <button class="btn-danger" data-remove="${symbol}" title="הסירי">✖</button>
    </div>
    <div class="chartbox"><canvas id="chart-${symbol}" aria-label="גרף ${symbol}"></canvas></div>

    <div class="section">חודשי — 5 שנים</div>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>חודש</th><th>פתיחה</th><th>גבוה</th><th>נמוך</th><th>סגירה</th><th>נפח</th></tr></thead>
        <tbody id="tbody-month-${symbol}"><tr><td colspan="6">…טוען</td></tr></tbody>
      </table>
    </div>

    <div class="section">סיכום שנתי</div>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>שנה</th><th>פתיחה</th><th>גבוה</th><th>נמוך</th><th>סגירה</th><th>נפח</th></tr></thead>
        <tbody id="tbody-year-${symbol}"><tr><td colspan="6">…טוען</td></tr></tbody>
      </table>
    </div>
  `;
  cardsEl.appendChild(card);

  // הסרה
  card.querySelector(`[data-remove="${symbol}"]`).addEventListener("click", ()=>{
    state.symbols.delete(symbol);
    state.charts.get(symbol)?.destroy();
    state.charts.delete(symbol);
    state.dataDaily.delete(symbol);
    state.dataMonthly.delete(symbol);
    state.dataYearly.delete(symbol);
    card.remove();
    renderLastTable(); refreshCount(); showOk(`הוסרה ${symbol}`);
  });
}

/* ===== גרף (סגירה חודשית) ===== */
function renderChart(symbol, monthlyRows){
  const ctx = document.getElementById(`chart-${symbol}`).getContext("2d");
  const labels = monthlyRows.map(r=>r.key);           // YYYY-MM
  const closes = monthlyRows.map(r=>r.close);
  if(state.charts.get(symbol)) state.charts.get(symbol).destroy();
  const chart = new Chart(ctx,{
    type:"line",
    data:{ labels, datasets:[{ label:`${symbol} (Close Monthly)`, data:closes, borderWidth:2, tension:.25, pointRadius:0, fill:false }]},
    options:{
      responsive:true,
      plugins:{ legend:{display:false}, tooltip:{mode:"index",intersect:false} },
      scales:{ x:{ ticks:{ maxTicksLimit:8 } }, y:{ ticks:{ callback:v=>Number(v).toLocaleString("he-IL") } } }
    }
  });
  state.charts.set(symbol, chart);
}

/* ===== טבלת חודשי ===== */
function renderMonthlyTable(symbol, monthlyRows){
  const body = document.getElementById(`tbody-month-${symbol}`);
  const rows = [...monthlyRows].reverse(); // אחרון למעלה
  body.innerHTML = rows.map(r=>`<tr>
    <td>${r.key}</td>
    <td>${fmtNum(r.open)}</td>
    <td>${fmtNum(r.high)}</td>
    <td>${fmtNum(r.low)}</td>
    <td>${closeCell(r.open,r.close)}</td>
    <td>${fmtNum(r.volume)}</td>
  </tr>`).join("");
}

/* ===== טבלת שנתי ===== */
function renderYearlyTable(symbol, yearlyRows){
  const body = document.getElementById(`tbody-year-${symbol}`);
  const rows = [...yearlyRows].reverse();
  body.innerHTML = rows.map(r=>`<tr>
    <td>${r.key}</td>
    <td>${fmtNum(r.open)}</td>
    <td>${fmtNum(r.high)}</td>
    <td>${fmtNum(r.low)}</td>
    <td>${closeCell(r.open,r.close)}</td>
    <td>${fmtNum(r.volume)}</td>
  </tr>`).join("");
}

/* ===== סיכום אחרון (Daily) ===== */
function renderLastTable(){
  if(state.symbols.size===0){ lastBody.innerHTML = `<tr><td colspan="8">—</td></tr>`; return; }
  lastBody.innerHTML = "";
  for(const s of state.symbols){
    const rows = state.dataDaily.get(s);
    if(!rows || !rows.length) continue;
    const r = rows[rows.length-1];
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="cap">${s}</td>
      <td>${fmtDate(r.date)}</td>
      <td>${fmtNum(r.open)}</td>
      <td>${fmtNum(r.high)}</td>
      <td>${fmtNum(r.low)}</td>
      <td>${closeCell(r.open,r.close)}</td>
      <td>${fmtNum(r.volume)}</td>
      <td><button class="btn-danger" data-remove-last="${s}" title="הסירי">✖</button></td>`;
    lastBody.appendChild(tr);
    tr.querySelector(`[data-remove-last="${s}"]`).addEventListener("click", ()=>{
      const btn = document.querySelector(`#card-${s} [data-remove="${s}"]`);
      if(btn) btn.click();
    });
  }
}

/* ===== טעינת סימול ===== */
async function loadSymbol(symbol){
  symbol = symbol.toUpperCase().trim();
  if(!symbol) return;
  ensureCard(symbol);
  setStatus(`טוען ${symbol}…`);
  try{
    const json = await fetchWithFallback(yahooUrl(symbol));
    const daily = parseYahooChart(json);
    if(!daily.length) throw new Error("אין נתונים");
    const monthly = aggregateMonthly(daily);
    const yearly  = aggregateYearly(daily);

    state.dataDaily.set(symbol, daily);
    state.dataMonthly.set(symbol, monthly);
    state.dataYearly.set(symbol, yearly);

    renderChart(symbol, monthly);
    renderMonthlyTable(symbol, monthly);
    renderYearlyTable(symbol, yearly);
    renderLastTable();

    clearErr(); showOk(`${symbol} נטען`);
  }catch(e){
    showErr(`שגיאה בטעינת ${symbol}: ${e.message||e}`);
  }finally{
    setStatus("מוכן");
  }
}

/* ===== טעינת כל הרשימה ===== */
async function loadAll(){
  clearErr(); clearOk();
  setStatus("טוען הכל…");
  for(const s of Array.from(state.symbols)){
    await loadSymbol(s);
  }
  setStatus("מוכן");
}

/* ===== הוספה/הסרה ===== */
function addSymbolFlow(){
  const inp = document.getElementById("addSymbol");
  const raw = inp.value.toUpperCase().trim();
  if(!raw) return;
  if(state.symbols.has(raw)){ showOk(`${raw} כבר קיים`); inp.value=""; return; }
  state.symbols.add(raw);
  inp.value="";
  refreshCount();
  loadSymbol(raw);
}

/* ===== אירועים ===== */
document.getElementById("addBtn").addEventListener("click", addSymbolFlow);
document.getElementById("addSymbol").addEventListener("keydown", (e)=>{
  if(e.key==="Enter"){ e.preventDefault(); addSymbolFlow(); }
});
document.getElementById("loadAllBtn").addEventListener("click", loadAll);

/* ===== אתחול ===== */
(function init(){
  refreshCount();
  for(const s of state.symbols) ensureCard(s);
})();
</script>
</body>
</html>
